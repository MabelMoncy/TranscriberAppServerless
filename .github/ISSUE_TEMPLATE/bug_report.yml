name: Bug report
description: File a bug report to help us improve the app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Tap on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Attach screenshots or logs that show the issue.
      placeholder: Paste logs in code fences.

  - type: input
    id: device
    attributes:
      label: Device info
      description: Device model and OS version.
      placeholder: e.g., Pixel 7 - Android 14
    validations:
      required: true

  - type: input
    id: flutter_version
    attributes:
      label: Flutter version
      placeholder: e.g., 3.24.0

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help.
