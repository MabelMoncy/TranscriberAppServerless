
name: transcriberapp
description: "A serverless AI Audio transcriber."
publish_to: 'none'
version: 3.0.1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # --- Serverless AI & Storage ---
  google_generative_ai: ^0.4.7
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

  receive_sharing_intent:
    git:
      url: https://github.com/KasemJaffer/receive_sharing_intent
      ref: 2cea396843cd3ab1b5ec4334be4233864637874e

  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  record: ^7.1.2
  sqflite: ^2.4.5
  path: ^1.9.1
  http: ^1.6.0
  mime: ^2.1.0
  http_parser: ^4.1.2
  flutter_dotenv: ^6.0.1
  rename: ^3.1.0
  intl: ^0.20.3
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  video_player: ^2.14.1
  chewie: ^1.17.4
  google_fonts: ^8.2.1
  external_app_launcher: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
